name: Hosting validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6, reviewed 2026-11-18
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, reviewed 2026-11-18
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            signaling-server/package-lock.json
      - run: npm run build:hosting
      - run: npm run test:client-config
      - run: npm run typecheck
      - run: npm run build:electron
      - run: npm run test:audit-gate
      - run: npm run audit:gate
      - run: npm run test:native-boundaries
      - run: npm run test:call-races
      - run: npm run test:password-races
      - run: npm run test:transfer-protocol
      - run: npm run test:native-input
      - run: npm run test:reliability
      - run: npm run test:hosting
      - run: npm run test:security
