name: Hosting validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            signaling-server/package-lock.json
      - run: npm run build:hosting
      - run: npm run typecheck
      - run: npm run build:electron
      - run: npm run test:hosting
      - run: npm run test:security
