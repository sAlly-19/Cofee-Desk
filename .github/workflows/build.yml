name: Build Windows
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            signaling-server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix signaling-server
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build --prefix signaling-server
      - run: npm run build:admin
      - run: npm run build
      - run: npm run test:security
      - run: npm run test:reliability
      - run: npm run test:file-clipboard
      - run: npm run test:history
      - run: npm run test:update-ui
      - run: npm run test:recovery
      - run: npm run verify:startup
      - if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          COFFEE_OFFICIAL_SIGNALING_URL: ${{ secrets.COFFEE_OFFICIAL_SIGNALING_URL }}
      - if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: npm run release:source
      - if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: npm run release:checksums
      - if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v6
        with:
          name: Coffee-Desk-Windows-x64
          path: |
            release/*Setup.exe
            release/*.blockmap
            release/latest.yml
            release/*source.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
