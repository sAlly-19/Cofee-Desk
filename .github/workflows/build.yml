name: Build Windows
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      # pg_ctl removes the Administrators group from its child token.
      # Grant only the current runner user access, inherited inside this checkout.
      - name: Allow restricted PostgreSQL process to use workspace
        shell: pwsh
        run: |
          $runnerSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          icacls "$env:GITHUB_WORKSPACE" /grant "*${runnerSid}:(OI)(CI)F" /Q
          if ($LASTEXITCODE -ne 0) { throw "Unable to grant workspace access to runner user" }
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            signaling-server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix signaling-server
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build --prefix signaling-server
      - run: npm run build:admin
      - run: npm run build
      - run: npm run test:database-helper
      - run: npm run test:security
      - run: npm run test:reliability
      - run: npm run test:file-clipboard
      - run: npm run test:history
      - run: npm run test:pointer-capture
      - run: npm run test:session-ui
      - run: npm run test:virtual-mouse
      - run: npm run test:update-ui
      - run: npm run test:recovery
      - run: npm run verify:startup
      - if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          COFFEE_OFFICIAL_SIGNALING_URL: ${{ secrets.COFFEE_OFFICIAL_SIGNALING_URL }}
      - if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: npm run release:source
      - if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: npm run release:checksums
      - if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v6
        with:
          name: Coffee-Desk-Windows-x64
          path: |
            release/*Setup.exe
            release/*.blockmap
            release/latest.yml
            release/*source.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Sanitized database startup diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: database-startup-diagnostics
          path: |
            artifacts/**/startup-error.log
            !artifacts/helper-*/**/startup-error.log
          if-no-files-found: ignore
          retention-days: 3
