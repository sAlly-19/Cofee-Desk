name: Build Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            signaling-server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix signaling-server
      - run: npm run typecheck
      - run: npm run build --prefix signaling-server
      - run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run release:source
      - run: npm run release:checksums
      - uses: actions/upload-artifact@v6
        with:
          name: Coffee-Desk-Windows-x64
          path: |
            release/*Setup.exe
            release/*.blockmap
            release/*source.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
