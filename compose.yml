services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: coffee_desk
      POSTGRES_USER: coffee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - coffee-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee -d coffee_desk"]
      interval: 5s
      retries: 10
volumes:
  coffee-postgres:
